name: n8n Targeted CI

on:
  workflow_dispatch:
  push:
    branches:
      - ci/termux-build-verification
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  install-build-verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Versions
        run: |
          node --version
          pnpm --version

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify sqlite3
        run: |
          pnpm --filter n8n exec node -e "const p=require('sqlite3/package.json'); console.log('sqlite3='+p.version)"
          pnpm --filter n8n exec node -e "require('sqlite3'); console.log('sqlite3_load=PASS')"

      - name: Build n8n
        run: pnpm build:n8n

      - name: Targeted package tests
        run: pnpm --filter n8n test -- --runInBand
        continue-on-error: true

      - name: Governance evidence
        if: always()
        run: |
          echo "CI_ENVIRONMENT: github-actions"
          echo "INSTALL: PERFORMED"
          echo "SQLITE3_CHECK: PERFORMED"
          echo "BUILD: PERFORMED"
          echo "TARGETED_TESTS: PERFORMED"
          echo "DEPLOYMENT: NOT_PERFORMED"
          echo "PRODUCTION_CLAIM: FALSE"
